<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHEL User Lab - RHCSA Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1600px; margin: 0 auto; background: white; min-height: 100vh; overflow: hidden; }
        .header { background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%); color: white; padding: 20px 30px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { font-size: 1.8em; }
        .progress-info { display: flex; gap: 20px; align-items: center; background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-size: 0.9em; }
        .question-nav { display: flex; gap: 10px; justify-content: center; }
        .question-btn { background: rgba(255,255,255,0.3); color: white; border: 2px solid rgba(255,255,255,0.5); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: bold; min-width: 60px; }
        .question-btn:hover { background: rgba(255,255,255,0.4); transform: translateY(-2px); }
        .question-btn.active { background: white; color: #ee0979; border-color: white; }
        .question-btn.completed { background: #00ff00; color: #000; border-color: #00ff00; }
        .question-btn.skipped { background: #ffbb00; color: #000; border-color: #ffbb00; }
        .question-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .content { display: grid; grid-template-columns: 450px 1fr; height: calc(100vh - 140px); }
        .question-panel { background: #f8f9fa; padding: 30px; border-right: 2px solid #e0e0e0; overflow-y: auto; }
        .terminal-panel { background: #000; padding: 20px; display: flex; flex-direction: column; }
        .question-header { margin-bottom: 20px; }
        .question-title { color: #333; font-size: 1.4em; margin-bottom: 10px; }
        .question-meta { display: flex; gap: 15px; font-size: 0.9em; color: #666; }
        .difficulty { background: #fff3cd; padding: 4px 12px; border-radius: 12px; color: #856404; }
        .question-body { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #ee0979; }
        .question-body p { color: #555; line-height: 1.6; margin-bottom: 15px; }
        .requirements { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 15px; margin-top: 15px; }
        .requirements h3 { color: #856404; font-size: 1.1em; margin-bottom: 10px; }
        .requirement-item { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: #856404; }
        .requirement-item.checked { color: #155724; background: #d4edda; padding: 5px; border-radius: 4px; }
        .requirement-item.failed { color: #721c24; background: #f8d7da; padding: 5px; border-radius: 4px; }
        .hint-section, .solution-section { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; padding: 15px; border-radius: 6px; margin-top: 15px; }
        .solution-section { background: #d4edda; border-color: #c3e6cb; color: #155724; }
        .hint-section h4, .solution-section h4 { margin-bottom: 10px; cursor: pointer; user-select: none; }
        .hint-content, .solution-content { display: none; margin-top: 10px; line-height: 1.6; }
        .hint-content.show, .solution-content.show { display: block; }
        .solution-content code { background: #fff; padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; }
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .action-buttons button { padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .btn-check { background: #007bff; color: white; grid-column: span 2; padding: 15px; font-size: 16px; }
        .btn-check:hover { background: #0056b3; transform: translateY(-2px); }
        .btn-skip { background: #ffc107; color: #000; }
        .btn-skip:hover { background: #e0a800; }
        .btn-reset { background: #6c757d; color: white; }
        .btn-reset:hover { background: #545b62; }
        .btn-prev { background: #6c757d; color: white; }
        .btn-prev:hover { background: #545b62; }
        .btn-next { background: #28a745; color: white; }
        .btn-next:hover { background: #218838; }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .result.show { display: block; }
        .result.success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .result.partial { background: #fff3cd; border: 1px solid #ffc107; color: #856404; }
        .result.error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .terminal-container { flex: 1; background: #000; border-radius: 8px; padding: 10px; overflow: hidden; }
        #terminal { height: 100%; width: 100%; }
        .connection-status { padding: 10px; text-align: center; font-size: 0.9em; margin-top: 10px; border-radius: 6px; }
        .connection-status.connected { background: #d4edda; color: #155724; }
        .connection-status.disconnected { background: #f8d7da; color: #721c24; }
        .loading { display: none; text-align: center; padding: 10px; color: #666; }
        .loading.show { display: block; }
        @media (max-width: 1200px) {
            .content { grid-template-columns: 1fr; height: auto; }
            .question-panel { border-right: none; border-bottom: 2px solid #e0e0e0; max-height: 50vh; }
            .terminal-panel { min-height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <h1>🐧 RHEL User Lab - RHCSA Practice</h1>
                <div class="progress-info">
                    <span id="progressText">Progress: 0/5</span>
                    <span id="scoreText">Score: 0/100</span>
                </div>
            </div>
            <div class="question-nav" id="questionNav"></div>
        </div>
        
        <div class="content">
            <div class="question-panel">
                <div class="question-header">
                    <h2 class="question-title" id="questionTitle">Loading...</h2>
                    <div class="question-meta">
                        <span class="difficulty" id="questionDifficulty">⭐</span>
                        <span id="questionCategory">Category</span>
                        <span id="questionNumber">Question 1/5</span>
                    </div>
                </div>
                
                <div class="question-body">
                    <p id="questionDescription">Loading question...</p>
                    <div class="requirements">
                        <h3>📋 Requirements:</h3>
                        <div id="requirementsList"></div>
                    </div>
                </div>
                
                <div class="hint-section">
                    <h4 onclick="toggleHints()">💡 Hints <span id="hintToggle">[Show]</span></h4>
                    <div class="hint-content" id="hintContent"></div>
                </div>
                
                <div class="solution-section">
                    <h4 onclick="toggleSolution()">📖 Solution <span id="solutionToggle">[Show]</span></h4>
                    <div class="solution-content" id="solutionContent"></div>
                </div>
                
                <div class="action-buttons">
                    <button class="btn-check" id="checkBtn" onclick="checkAnswer()">🔍 Check Answer</button>
                    <button class="btn-prev" id="prevBtn" onclick="prevQuestion()">← Previous</button>
                    <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next →</button>
                    <button class="btn-skip" onclick="skipQuestion()">⏭️ Skip</button>
                    <button class="btn-reset" onclick="resetCurrentQuestion()">🔄 Reset</button>
                </div>
                
                <div class="loading" id="loading">⏳ Checking...</div>
                <div id="result" class="result"></div>
                <div class="connection-status" id="connectionStatus"></div>
            </div>
            
            <div class="terminal-panel">
                <div class="terminal-container">
                    <div id="terminal"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
    <script>
        const questions = [
            {
                id: 1, title: "Create Basic User Account", category: "User Management", difficulty: "⭐", points: 15,
                description: "You are a system administrator and need to create a new user account for a developer joining your team.",
                requirements: [
                    { id: 'username', text: 'Username: john_dev' },
                    { id: 'uid', text: 'User ID (UID): 2500' },
                    { id: 'home', text: 'Home Directory: /home/john_dev' },
                    { id: 'shell', text: 'Shell: /bin/bash' },
                    { id: 'comment', text: 'Comment: Developer Account' },
                    { id: 'group', text: 'Primary Group: developers (GID: 3000)' }
                ],
                hints: [
                    "Always create the group before creating the user",
                    "Use 'groupadd -g GID groupname' to create a group with specific GID",
                    "Use 'useradd' command with appropriate flags: -u, -g, -d, -s, -c"
                ],
                solution: [
                    "sudo groupadd -g 3000 developers",
                    "sudo useradd -u 2500 -g developers -d /home/john_dev -s /bin/bash -c \"Developer Account\" john_dev",
                    "id john_dev",
                    "getent passwd john_dev"
                ],
                verifyEndpoint: '/check-solution',
                cleanupCommands: 'userdel -r john_dev; groupdel developers'
            },
            {
                id: 2, title: "Create User with Multiple Groups", category: "User Management", difficulty: "⭐⭐", points: 20,
                description: "Create a user account that belongs to multiple groups for a system administrator who needs access to various services.",
                requirements: [
                    { id: 'username', text: 'Username: admin_user' },
                    { id: 'uid', text: 'User ID (UID): 3000' },
                    { id: 'primaryGroup', text: 'Primary Group: sysadmin (GID: 4000)' },
                    { id: 'secondaryGroups', text: 'Secondary Groups: wheel, docker' },
                    { id: 'home', text: 'Home Directory: /home/admin_user' },
                    { id: 'shell', text: 'Shell: /bin/bash' }
                ],
                hints: [
                    "Create all groups first (primary and secondary)",
                    "Use -G flag for secondary groups (comma-separated, no spaces)",
                    "The 'wheel' and 'docker' groups might already exist on your system"
                ],
                solution: [
                    "sudo groupadd -g 4000 sysadmin",
                    "sudo groupadd wheel 2>/dev/null || true",
                    "sudo groupadd docker 2>/dev/null || true",
                    "sudo useradd -u 3000 -g sysadmin -G wheel,docker -d /home/admin_user -s /bin/bash admin_user",
                    "id admin_user",
                    "groups admin_user"
                ],
                verifyEndpoint: '/check-question-2',
                cleanupCommands: 'userdel -r admin_user; groupdel sysadmin'
            },
            {
                id: 3, title: "Create System Service Account", category: "User Management", difficulty: "⭐⭐", points: 20,
                description: "Create a system account for running a web service. System accounts are used by services and daemons, not for interactive login.",
                requirements: [
                    { id: 'username', text: 'Username: webapp' },
                    { id: 'uid', text: 'UID: Below 1000 (system account range)' },
                    { id: 'home', text: 'Home Directory: /var/www/webapp' },
                    { id: 'shell', text: 'Shell: /sbin/nologin (no login)' },
                    { id: 'system', text: 'System account flag used' }
                ],
                hints: [
                    "Use the -r flag to create a system account",
                    "System accounts automatically get UIDs below 1000",
                    "/sbin/nologin prevents interactive login",
                    "You may need to create the /var/www directory first"
                ],
                solution: [
                    "sudo mkdir -p /var/www",
                    "sudo useradd -r -d /var/www/webapp -s /sbin/nologin webapp",
                    "id webapp",
                    "getent passwd webapp"
                ],
                verifyEndpoint: '/check-question-3',
                cleanupCommands: 'userdel -r webapp'
            },
            {
                id: 4, title: "Modify Existing User Properties", category: "User Management", difficulty: "⭐⭐⭐", points: 25,
                description: "You need to modify an existing user's properties. First create the user, then modify it according to the new requirements.",
                requirements: [
                    { id: 'username', text: 'Username: testuser' },
                    { id: 'newShell', text: 'Modified Shell: /bin/zsh' },
                    { id: 'newHome', text: 'Modified Home: /opt/testuser' },
                    { id: 'newComment', text: 'Modified Comment: Modified Test User' },
                    { id: 'addedGroup', text: 'Added to group: testgroup' }
                ],
                hints: [
                    "First create the user with basic settings",
                    "Use 'usermod' command to modify existing users",
                    "Use -s for shell, -d for home, -c for comment",
                    "Use -aG to ADD user to a supplementary group (don't remove from others)",
                    "Create testgroup first before adding user to it"
                ],
                solution: [
                    "sudo useradd -m testuser",
                    "sudo groupadd testgroup",
                    "sudo usermod -s /bin/zsh testuser",
                    "sudo usermod -d /opt/testuser -m testuser",
                    "sudo usermod -c \"Modified Test User\" testuser",
                    "sudo usermod -aG testgroup testuser",
                    "getent passwd testuser",
                    "groups testuser"
                ],
                verifyEndpoint: '/check-question-4',
                cleanupCommands: 'userdel -r testuser; groupdel testgroup; rm -rf /opt/testuser'
            },
            {
                id: 5, title: "Create User with Password Expiration", category: "User Management", difficulty: "⭐⭐⭐", points: 20,
                description: "Create a temporary contractor account with password expiration policy for security compliance.",
                requirements: [
                    { id: 'username', text: 'Username: contractor' },
                    { id: 'uid', text: 'UID: 5000' },
                    { id: 'expiry', text: 'Account expires: 2025-12-31' },
                    { id: 'maxdays', text: 'Password max age: 30 days' },
                    { id: 'warndays', text: 'Password warning: 7 days before expiry' }
                ],
                hints: [
                    "Use 'chage' command to set password aging policies",
                    "Use -E flag with useradd or chage for account expiration date",
                    "Use -M for maximum password age",
                    "Use -W for warning days",
                    "Date format: YYYY-MM-DD"
                ],
                solution: [
                    "sudo useradd -u 5000 -e 2025-12-31 contractor",
                    "sudo chage -M 30 contractor",
                    "sudo chage -W 7 contractor",
                    "sudo chage -l contractor",
                    "getent passwd contractor"
                ],
                verifyEndpoint: '/check-question-5',
                cleanupCommands: 'userdel -r contractor'
            }
        ];

        let currentQuestionIndex = 0;
        let questionStates = [];
        let term, socket, fitAddon;
        let isConnected = false;
        const API_URL = window.location.origin;
        const WS_URL = API_URL.replace('http', 'ws');

        function initializeState() {
            const saved = localStorage.getItem('rhel_lab_progress');
            if (saved) {
                questionStates = JSON.parse(saved);
            } else {
                questionStates = questions.map(q => ({
                    id: q.id,
                    status: 'incomplete',
                    score: 0,
                    maxScore: q.points
                }));
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem('rhel_lab_progress', JSON.stringify(questionStates));
        }

        window.onload = function() {
            initializeState();
            renderQuestionNav();
            loadQuestion(currentQuestionIndex);
            initTerminal();
        };

        function renderQuestionNav() {
            const nav = document.getElementById('questionNav');
            nav.innerHTML = '';
            
            questions.forEach((q, index) => {
                const btn = document.createElement('button');
                btn.className = 'question-btn';
                btn.textContent = `Q${q.id}`;
                btn.onclick = () => loadQuestion(index);
                
                const state = questionStates[index];
                if (state.status === 'completed') {
                    btn.classList.add('completed');
                    btn.innerHTML = `Q${q.id} ✓`;
                } else if (state.status === 'skipped') {
                    btn.classList.add('skipped');
                    btn.innerHTML = `Q${q.id} ⏭`;
                }
                
                if (index === currentQuestionIndex) {
                    btn.classList.add('active');
                }
                
                nav.appendChild(btn);
            });
            
            updateProgress();
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = questions[index];
            
            document.getElementById('questionTitle').textContent = q.title;
            document.getElementById('questionDifficulty').textContent = q.difficulty;
            document.getElementById('questionCategory').textContent = q.category;
            document.getElementById('questionNumber').textContent = `Question ${index + 1}/5`;
            document.getElementById('questionDescription').textContent = q.description;
            
            const reqList = document.getElementById('requirementsList');
            reqList.innerHTML = '';
            q.requirements.forEach(req => {
                const div = document.createElement('div');
                div.className = 'requirement-item';
                div.innerHTML = `<span>☐</span> <span>${req.text}</span>`;
                reqList.appendChild(div);
            });
            
            document.getElementById('hintContent').innerHTML = q.hints.map(h => `• ${h}<br>`).join('');
            document.getElementById('solutionContent').innerHTML = q.solution.map(s => `<code>${s}</code><br>`).join('');
            
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === questions.length - 1;
            document.getElementById('result').classList.remove('show');
            
            renderQuestionNav();
        }

        function toggleHints() {
            const content = document.getElementById('hintContent');
            const toggle = document.getElementById('hintToggle');
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                toggle.textContent = '[Show]';
            } else {
                content.classList.add('show');
                toggle.textContent = '[Hide]';
            }
        }

        function toggleSolution() {
            const content = document.getElementById('solutionContent');
            const toggle = document.getElementById('solutionToggle');
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                toggle.textContent = '[Show]';
            } else {
                content.classList.add('show');
                toggle.textContent = '[Hide]';
            }
        }

        async function checkAnswer() {
            if (!isConnected) {
                alert('Not connected to server. Please start the server first.');
                return;
            }
            
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            loading.classList.add('show');
            result.classList.remove('show');
            
            try {
                const q = questions[currentQuestionIndex];
                const response = await fetch(`${API_URL}${q.verifyEndpoint}`, {
                    method: 'POST'
                });
                
                const data = await response.json();
                
                loading.classList.remove('show');
                result.classList.add('show');
                
                let correctCount = 0;
                const reqItems = document.querySelectorAll('#requirementsList .requirement-item');
                
                data.checks.forEach((check, index) => {
                    if (reqItems[index]) {
                        if (check.passed) {
                            reqItems[index].classList.add('checked');
                            reqItems[index].classList.remove('failed');
                            reqItems[index].querySelector('span:first-child').textContent = '✓';
                            correctCount++;
                        } else {
                            reqItems[index].classList.add('failed');
                            reqItems[index].classList.remove('checked');
                            reqItems[index].querySelector('span:first-child').textContent = '✗';
                        }
                    }
                });
                
                const totalReqs = q.requirements.length;
                const percentage = (correctCount / totalReqs) * 100;
                
                if (data.success) {
                    result.className = 'result show success';
                    result.innerHTML = `<strong>🎉 Perfect!</strong><br>All requirements met! (${correctCount}/${totalReqs})<br><br>`;
                    data.checks.forEach(check => {
                        result.innerHTML += `<div style="padding:5px;">${check.message}</div>`;
                    });
                    result.innerHTML += `<br><strong>Score: +${q.points} points</strong>`;
                    
                    questionStates[currentQuestionIndex].status = 'completed';
                    questionStates[currentQuestionIndex].score = q.points;
                    saveState();
                    renderQuestionNav();
                    
                } else if (percentage >= 50) {
                    result.className = 'result show partial';
                    result.innerHTML = `<strong>⚠️ Partially Correct</strong><br>Progress: ${correctCount}/${totalReqs} requirements (${percentage.toFixed(0)}%)<br><br>`;
                    data.checks.forEach(check => {
                        result.innerHTML += `<div style="padding:5px;">${check.message}</div>`;
                    });
                } else {
                    result.className = 'result show error';
                    result.innerHTML = `<strong>❌ Issues Found</strong><br>Progress: ${correctCount}/${totalReqs} requirements (${percentage.toFixed(0)}%)<br><br>`;
                    data.checks.forEach(check => {
                        result.innerHTML += `<div style="padding:5px;">${check.message}</div>`;
                    });
                }
                
            } catch (error) {
                loading.classList.remove('show');
                result.className = 'result show error';
                result.classList.add('show');
                result.innerHTML = '<strong>Error:</strong> Cannot connect to server. Make sure the backend is running.';
            }
        }

        function skipQuestion() {
            if (confirm('Skip this question? You can come back to it later.')) {
                questionStates[currentQuestionIndex].status = 'skipped';
                saveState();
                
                if (currentQuestionIndex < questions.length - 1) {
                    loadQuestion(currentQuestionIndex + 1);
                } else {
                    renderQuestionNav();
                }
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            }
        }

        async function resetCurrentQuestion() {
            if (!confirm('Reset this question? This will clean up any users/groups you created.')) {
                return;
            }
            
            try {
                const q = questions[currentQuestionIndex];
                const response = await fetch(`${API_URL}/reset-question`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        questionId: q.id,
                        cleanupCommands: q.cleanupCommands 
                    })
                });
                
                const data = await response.json();
                
                term.writeln('\r\n\x1b[32m=== Question Reset ===\x1b[0m');
                term.writeln(`\x1b[32m${data.output}\x1b[0m\r\n`);
                
                questionStates[currentQuestionIndex].status = 'incomplete';
                questionStates[currentQuestionIndex].score = 0;
                saveState();
                
                loadQuestion(currentQuestionIndex);
                
            } catch (error) {
                term.writeln('\r\n\x1b[31mError: Cannot connect to server\x1b[0m\r\n');
            }
        }

        function updateProgress() {
            const completed = questionStates.filter(q => q.status === 'completed').length;
            const totalScore = questionStates.reduce((sum, q) => sum + q.score, 0);
            const maxScore = questions.reduce((sum, q) => sum + q.points, 0);
            
            document.getElementById('progressText').textContent = `Progress: ${completed}/5`;
            document.getElementById('scoreText').textContent = `Score: ${totalScore}/${maxScore}`;
        }

        function initTerminal() {
            term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", monospace',
                theme: {
                    background: '#000000',
                    foreground: '#ffffff',
                    cursor: '#ffffff',
                    black: '#000000',
                    red: '#ff0000',
                    green: '#00ff00',
                    yellow: '#ffff00',
                    blue: '#0000ff',
                    magenta: '#ff00ff',
                    cyan: '#00ffff',
                    white: '#ffffff',
                    brightBlack: '#808080',
                    brightRed: '#ff0000',
                    brightGreen: '#00ff00',
                    brightYellow: '#ffff00',
                    brightBlue: '#0000ff',
                    brightMagenta: '#ff00ff',
                    brightCyan: '#00ffff',
                    brightWhite: '#ffffff'
                },
                rows: 24,
                cols: 80
            });

            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal'));
            fitAddon.fit();

            window.addEventListener('resize', () => {
                fitAddon.fit();
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'resize',
                        cols: term.cols,
                        rows: term.rows
                    }));
                }
            });

            connectWebSocket();
        }

        function connectWebSocket() {
            const connectionStatus = document.getElementById('connectionStatus');
            const checkBtn = document.getElementById('checkBtn');

            term.writeln('\x1b[33m🔄 Connecting to terminal server...\x1b[0m');

            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                term.writeln('\x1b[32m✓ Connected! You now have a real terminal.\x1b[0m');
                term.writeln('\x1b[36mType your commands below. Use sudo for privileged operations.\x1b[0m');
                term.writeln('');
                
                isConnected = true;
                
                connectionStatus.className = 'connection-status connected';
                connectionStatus.textContent = '✓ Terminal connected';
                
                checkBtn.disabled = false;

                socket.send(JSON.stringify({
                    type: 'resize',
                    cols: term.cols,
                    rows: term.rows
                }));
            };

            socket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'output') {
                        term.write(msg.data);
                    } else if (msg.type === 'exit') {
                        term.writeln('\r\n\x1b[31mTerminal session ended.\x1b[0m');
                        isConnected = false;
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            socket.onerror = (error) => {
                term.writeln('\r\n\x1b[31m✗ Connection error!\x1b[0m');
                term.writeln('\x1b[31mMake sure the server is running: sudo node server.js\x1b[0m');
                
                connectionStatus.className = 'connection-status disconnected';
                connectionStatus.textContent = '❌ Server not running';
                
                isConnected = false;
                checkBtn.disabled = true;
            };

            socket.onclose = () => {
                if (isConnected) {
                    term.writeln('\r\n\x1b[33m⚠ Disconnected from server.\x1b[0m');
                    isConnected = false;
                    connectionStatus.className = 'connection-status disconnected';
                    connectionStatus.textContent = '❌ Connection lost';
                    checkBtn.disabled = true;
                    
                    setTimeout(() => {
                        term.writeln('\x1b[33m🔄 Attempting to reconnect...\x1b[0m');
                        connectWebSocket();
                    }, 3000);
                }
            };

            term.onData((data) => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: 'input',
                        data: data
                    }));
                }
            });
        }
    </script>
